<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://ujclhweqqifgoiscvqmd.supabase.co; connect-src 'self' https://ujclhweqqifgoiscvqmd.supabase.co https://unpkg.com https://cdnjs.cloudflare.com;">

  <title>NEO • Signaturesi</title>
  <link rel="stylesheet" href="/neo.css?v=50">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
</head>
<body class="sidebar-collapsed">

  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <aside class="sidebar collapsed" id="sidebar">
    <div class="sidebar-header">
      <button class="brand-button" id="brandBtn" type="button">
        <span class="brand-copy">
          <strong>NEO Engine</strong>
          <small>Signaturesi Central</small>
        </span>
      </button>

      <button class="icon-btn" id="collapseSidebarBtn" title="Close Sidebar" type="button">
        <i data-lucide="columns-2" size="20"></i>
      </button>
    </div>

    <div class="sidebar-content">

      <nav class="sidebar-primary-nav" aria-label="Primary navigation">

        <button
          class="new-chat-btn"
          id="newChatBtn"
          type="button"
          title="New conversation"
        >
          <span class="sidebar-nav-icon">
            <i data-lucide="square-pen" size="18"></i>
          </span>

          <span>New Conversation</span>
        </button>

        <button
          class="sidebar-personality-btn"
          id="sidebarPersonalitiesBtn"
          type="button"
          title="NEO Personalities"
        >
          <span class="sidebar-nav-icon">
            <i data-lucide="sparkles" size="18"></i>
          </span>

          <span>NEO Personalities</span>
        </button>

      </nav>

      <div class="history-section">
        <span class="section-title">Recent Chats</span>
        <div class="history-list" id="historyList"></div>
      </div>

    </div>

    <div class="sidebar-footer">
      <div
        class="user-popup-menu"
        id="userPopupMenu"
        role="menu"
        aria-hidden="true"
      >
        <button
          class="popup-item"
          id="settingsBtn"
          type="button"
          role="menuitem"
        >
          <span class="popup-icon-wrapper">
            <i data-lucide="settings-2" size="18"></i>
          </span>

          <span>Settings</span>
        </button>

        <button
          class="popup-item"
          id="sidebarDarkModeToggle"
          type="button"
          role="menuitem"
        >
          <span class="popup-icon-wrapper">
            <i data-lucide="sun-moon" size="18"></i>
          </span>

          <span>Appearance</span>
        </button>

        <div class="popup-divider"></div>

        <button
          class="popup-item danger"
          id="logoutBtn"
          type="button"
          role="menuitem"
        >
          <span class="popup-icon-wrapper">
            <i data-lucide="log-out" size="18"></i>
          </span>

          <span>Log out</span>
        </button>
      </div>

      <button
        class="user-profile-btn"
        id="userProfileBtn"
        type="button"
        aria-haspopup="menu"
        aria-expanded="false"
      >
        <div id="userAvatar">U</div>

        <div class="user-info">
          <span class="user-name" id="userNameDisplay">@user</span>
          <span class="user-badge" id="userPlanBadge">Free Plan</span>
        </div>

        <!-- Restored original bolt icon -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="more-icon"
          aria-hidden="true"
        >
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <circle cx="12" cy="12" r="4"/>
        </svg>
      </button>
    </div>
  </aside>

  <!-- Rest of the HTML stays the same as before (conversation, composer, modals, etc.) -->
  <!-- … (all existing HTML unchanged) … -->

  <script src="/neo.js?v=48"></script>
</body>
</html>
